<app-bike-list-item *ngFor = "let bike of bikeList; let index = index" [bikeListItem] = "bike" [ngClass]="activeClass ? 'yellow': 'white'" (click)="selectBike(bike)" [appHoverHighlight] = "'teal'"></app-bike-list-item>
<button type = "button" (click)="onDelete()">Delete</button>
<button type = "button" (click)="onEdit()">Edit</button>

<form [formGroup]="bikeForm">
  <div>
    <label for = "id">id: </label>
    <input id = "id" type = "number" formControlName = "id" [appFocusStyle]="'dotted lightgreen'">
  </div>
  <div>
    <label for = "make">Make: </label>
    <input id = "make" type = "text" formControlName = "make" [appFocusStyle]="'solid #40E0D0'">
  </div>
  <div>
    <label for = "model">Model: </label>
    <input id = "model" type = "text" formControlName = "model" [appFocusStyle]="'dotted lightgreen'">
  </div>
  <div>
    <label for = "year">Year: </label>
    <input id = "year" type = "number" formControlName = "year" [appFocusStyle]="'solid #40E0D0'">
  </div>
  <div>
    <label for = "streetLegal">Street Legal Status: </label>
    <input id = "streetLegal" type = "checkbox" formControlName = "streetLegal">
  </div>
  <button type = "button" (click)="onAdd()">Add</button>
  <button type = "button" (click)="onUpdate()">Update</button>
</form>
